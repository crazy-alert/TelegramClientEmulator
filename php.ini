; Полное отключение вывода ошибок (встроенный PHP-сервер
; выбрасывает warning'и multipart/form-data в stdout)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = 0

; Буферизация вывода с первого байта — перехватывает
; любые warning'и до того, как они попадут в ответ
output_buffering = 4096

; Отключаем автоматический разбор POST-данных,
; чтобы избежать warning'ов при multipart/form-data без boundary.
; POST парсится вручную в Application::parseInput().
enable_post_data_reading = Off
