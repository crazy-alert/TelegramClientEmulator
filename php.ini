display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; Отключаем автоматический разбор POST-данных,
; чтобы избежать warning'ов встроенного PHP-сервера
; при multipart/form-data запросах без boundary.
; POST парсится вручную в Application::handle().
enable_post_data_reading = Off
