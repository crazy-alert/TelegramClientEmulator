services:
  telegram-emulator:
    image: php:8.3-cli-alpine
    container_name: telegram-emulator
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -lc 'php -c /app/php.ini -S "$$APP_HOST:$$APP_PORT" -t public public/index.php'
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8080"
      DATA_DIR: "/app/data"
      MEDIA_DIR: "/app/data/media"
      MEDIA_MAX_BYTES: "10485760"
      LOG_DIR: "/app/var/logs"
      WEBHOOK_TIMEOUT_MS: "10000"
      WEBHOOK_RETRY_MAX_ATTEMPTS: "1"
      WEBHOOK_RETRY_DELAY_MS: "0"
      LONG_POLLING_MAX_TIMEOUT_SECONDS: "3"
      LOG_LEVEL: "info"
    expose:
      - "8080"
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - ./:/app
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1:' . getenv('APP_PORT') . '/health') === false ? 1 : 0);\""]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - app-backend

networks:
  app-backend:
    external: true
    name: "${APP_BACKEND_NETWORK:-constr_app-backend}"
