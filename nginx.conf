worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    # Включаем буферизацию — nginx дожидается полного ответа от бэкенда
    # и только потом применяет sub_filter
    proxy_buffering on;
    server_tokens off;

    server {
        listen 8080;

        location / {
            proxy_pass http://127.0.0.1:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Запрещаем бэкенду сжимать ответ (нужно для sub_filter)
            proxy_set_header Accept-Encoding "";

            # Вырезаем warning multipart/form-data из ответов
            # (формат с HTML-тегами при display_errors=On)
            sub_filter_types application/json text/html text/plain;
            sub_filter '<br />' '';
            sub_filter '<b>Warning</b>:  Missing boundary in multipart/form-data POST data in <b>Unknown</b> on line <b>0</b>' '';
            # (plain-text формат при display_errors=Off)
            sub_filter 'Warning: Missing boundary in multipart/form-data POST data in Unknown on line 0' '';
            sub_filter_once off;
        }
    }
}
