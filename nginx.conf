worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    # Отключаем буферизацию для мгновенной доставки ответов
    proxy_buffering off;

    # Убираем стандартные заголовки nginx
    server_tokens off;

    server {
        listen 8080;

        # Проксируем все запросы на PHP built-in server
        location / {
            proxy_pass http://127.0.0.1:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
